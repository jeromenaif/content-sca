<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scarlet Mars 2026 - Visual Generator v2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { opacity: 0.7; }
        
        .post-selector {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .post-btn {
            padding: 12px 8px;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        .post-btn:hover { background: rgba(255,255,255,0.1); }
        .post-btn.active {
            border-color: #E61F13;
            background: rgba(230,31,19,0.2);
        }
        .post-btn .date { font-size: 12px; opacity: 0.7; }
        .post-btn .format { font-size: 11px; margin-top: 4px; }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 580px;
            gap: 20px;
        }
        .info-panel {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
        }
        .preview-panel {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 10px;
        }
        .badge-green { background: #2BA600; }
        .badge-blue { background: #0066CC; }
        .badge-yellow { background: #FFB800; color: #000; }
        .badge-format { background: rgba(255,255,255,0.1); }
        
        .lang-toggle { margin: 20px 0; }
        .lang-toggle label { font-size: 14px; opacity: 0.7; display: block; margin-bottom: 8px; }
        .lang-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            margin-right: 10px;
            transition: all 0.2s;
        }
        .lang-btn:hover { background: rgba(255,255,255,0.2); }
        .lang-btn.active { background: #E61F13; font-weight: 600; }
        
        .content-box {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        .content-box h3 { font-size: 14px; margin-bottom: 15px; opacity: 0.7; }
        .content-box pre { font-size: 13px; white-space: pre-wrap; line-height: 1.6; }
        
        .caption-box {
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border-left: 4px solid #E61F13;
        }
        .caption-box h4 { 
            font-size: 12px; 
            opacity: 0.6; 
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .caption-box p { 
            font-size: 14px; 
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        .export-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: #E61F13;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 16px;
        }
        .export-btn:hover { background: #c41810; transform: translateY(-1px); }
        .export-btn:active { transform: translateY(0); }
        .export-btn.loading { opacity: 0.7; cursor: wait; }
        
        /* Comments Section */
        .comments-section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            margin-top: 20px;
            border-left: 4px solid #E61F13;
        }
        .comments-section h3 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #E61F13;
        }
        .comments-intro {
            background: rgba(46,213,115,0.15);
            border-left: 4px solid #2ed573;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .feedback-guide {
            background: rgba(13,202,240,0.1);
            border-left: 4px solid #0DCAF0;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .feedback-guide h4 {
            font-size: 14px;
            color: #0DCAF0;
            margin-bottom: 10px;
        }
        .feedback-guide ul {
            list-style: none;
            padding-left: 0;
            font-size: 13px;
            line-height: 1.8;
        }
        .feedback-guide li {
            padding: 4px 0;
            opacity: 0.9;
        }
        .tally-iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 12px;
            background: white;
        }
        .setup-notice {
            background: rgba(255,193,7,0.15);
            border-left: 4px solid #FFC107;
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            opacity: 0.9;
        }
        .setup-notice strong {
            color: #FFC107;
        }
        
        /* Visual Templates */
        .visual {
            width: 540px;
            height: 540px;
            background: #E61F13;
            border-radius: 16px;
            padding: 30px;
            position: relative;
            font-family: Arial, sans-serif;
        }
        .visual-inner {
            background: white;
            border-radius: 12px;
            height: 100%;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }
        .visual-title {
            color: #E61F13;
            font-size: 22px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
            line-height: 1.2;
        }
        .logo {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-family: 'Arial Black', sans-serif;
            font-size: 18px;
            color: white;
            font-weight: 900;
        }
        
        /* Pie Chart specific */
        .pie-container { display: flex; align-items: center; gap: 30px; flex: 1; }
        .pie-chart { width: 180px; height: 180px; border-radius: 50%; position: relative; flex-shrink: 0; }
        .legend-item { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .legend-color { width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0; }
        .legend-text { font-size: 14px; color: #4D4D4D; }
        
        /* Checklist specific */
        .check-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 16px;
            background: #F3F3F3;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .check-box {
            width: 28px;
            height: 28px;
            background: #2BA600;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
        }
        .check-text { font-size: 15px; color: #000; }
        
        /* Poll specific */
        .poll-question {
            color: #E61F13;
            font-size: 24px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.3;
        }
        .poll-option {
            padding: 20px 24px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 700;
        }
        .poll-option.opt1 { background: #E8F5E9; border: 3px solid #2BA600; }
        .poll-option.opt2 { background: #FFF3E0; border: 3px solid #FFB800; }
        
        /* Meme specific */
        .meme-inner {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            border-radius: 12px;
            background: white;
        }
        .meme-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .meme-panel.top { background: #f8f8f8; border-bottom: 3px solid #ddd; }
        .meme-panel.bottom { background: #fff; }
        .meme-emoji { font-size: 60px; margin-bottom: 10px; }
        .meme-text { font-size: 18px; font-weight: 700; text-transform: uppercase; }
        
        .footer { margin-top: 20px; text-align: center; font-size: 12px; opacity: 0.5; }
        
        .visual-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        @media (max-width: 1200px) {
            .main-grid { grid-template-columns: 1fr; }
            .preview-panel { order: -1; }
            .visual { width: 100%; max-width: 540px; margin: 0 auto; }
            .post-selector { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 Scarlet Visual Generator</h1>
            <p>Mars 2026 • 6 publications • Version complète avec captions</p>
        </div>
        
        <div class="post-selector" id="postSelector"></div>
        
        <div class="main-grid">
            <div class="info-panel" id="infoPanel"></div>
            <div class="preview-panel" id="previewPanel"></div>
        </div>
        
        <div class="footer">
            Format: 540×540px • Optimisé Facebook & Instagram • Police: DIN Next LT Pro (à appliquer en production)
        </div>
    </div>

    <script>
        const posts = [
            {
                id: 1, date: '02/03', format: 'pie_chart', pilier: 'Bon Marché',
                theme: 'Le groupe WhatsApp familial',
                formatLabel: '📊 Pie Chart',
                data: {
                    fr: { chartTitle: 'Le groupe familial', legends: ['Répondre aux messages', 'Mettre en sourdine'], percentages: [5, 95] },
                    nl: { chartTitle: 'De familiegroep', legends: ['Berichten beantwoorden', 'Op stil zetten'], percentages: [5, 95] }
                },
                captions: {
                    fr: "On adore notre famille. On adore aussi le bouton \"sourdine\" 🔇\n\nChez Scarlet, tu ne paies que pour ce que tu utilises vraiment. Si seulement on pouvait faire pareil avec les notifications du groupe familial...",
                    nl: "We zijn gek op onze familie. We zijn ook gek op de \"stil\"-knop 🔇\n\nBij Scarlet betaal je enkel voor wat je echt gebruikt. Konden we dat ook met de meldingen van de familiegroep..."
                }
            },
            {
                id: 2, date: '09/03', format: 'meme', pilier: 'Qualité',
                theme: 'Le WiFi chez les parents',
                formatLabel: '😂 Meme',
                data: {
                    fr: { topText: 'Le WiFi chez moi', bottomText: 'Le WiFi chez mes parents' },
                    nl: { topText: 'De WiFi bij mij thuis', bottomText: 'De WiFi bij mijn ouders' }
                },
                captions: {
                    fr: "Chez tes parents, le mot de passe WiFi c'est une épreuve de Koh-Lanta 📝\n\n\"C'est écrit sur le post-it derrière la télé... non l'autre... avec des majuscules... et un 3 à la place du E...\"\n\nChez Scarlet, on aime les choses simples. Ta connexion fonctionne, point.",
                    nl: "Bij je ouders is het WiFi-wachtwoord een ware beproeving 📝\n\n\"Het staat op de post-it achter de TV... nee die andere... met hoofdletters... en een 3 in plaats van de E...\"\n\nBij Scarlet houden we van eenvoud. Je verbinding werkt, punt."
                }
            },
            {
                id: 3, date: '16/03', format: 'checklist', pilier: 'Transparence',
                theme: 'Les excuses pour rester sur le canapé',
                formatLabel: '✅ Checklist',
                data: {
                    fr: { checklistTitle: 'Mes excuses pour le canapé', items: ['Il fait trop froid dehors', 'Il fait trop chaud dehors', 'Ma série va pas se regarder toute seule', 'Ma connexion est trop bonne'] },
                    nl: { checklistTitle: "M'n excuses voor de bank", items: ['Het is te koud buiten', 'Het is te warm buiten', 'Mijn serie kijkt zichzelf niet', 'Mijn verbinding is te goed'] }
                },
                captions: {
                    fr: "Avoue, t'as déjà utilisé au moins 3 de ces excuses cette semaine 😏\n\nEt avec Scarlet, tu n'as pas besoin d'excuse pour profiter de ta connexion. Ce que tu vois = ce que tu paies.",
                    nl: "Geef toe, je hebt er deze week minstens 3 van gebruikt 😏\n\nEn met Scarlet heb je geen excuus nodig om van je verbinding te genieten. Wat je ziet = wat je betaalt."
                }
            },
            {
                id: 4, date: '20/03', format: 'meme', pilier: 'Bon Marché',
                theme: 'Les onglets Chrome ouverts',
                formatLabel: '😂 Meme',
                data: {
                    fr: { topText: 'Mes onglets Chrome', bottomText: 'Ma mémoire pour les retenir' },
                    nl: { topText: 'Mijn Chrome-tabbladen', bottomText: 'Mijn geheugen om ze te onthouden' }
                },
                captions: {
                    fr: "Moi : \"Je vais fermer quelques onglets\"\nAussi moi : *en ouvre 4 de plus* 🫠\n\nHeureusement, Scarlet n'a pas de frais cachés. Contrairement à mes 47 onglets \"à lire plus tard\".",
                    nl: "Ik: \"Ik ga wat tabbladen sluiten\"\nOok ik: *opent er 4 bij* 🫠\n\nGelukkig heeft Scarlet geen verborgen kosten. In tegenstelling tot mijn 47 tabbladen \"om later te lezen\"."
                }
            },
            {
                id: 5, date: '23/03', format: 'poll', pilier: 'Qualité',
                theme: 'Météo belge imprévisible',
                formatLabel: '❓ Q&A / Poll',
                data: {
                    fr: { question: 'Ton plan quand il fait beau ?', options: ['Sortir profiter ☀️', 'Attendre la drache 🌧️'] },
                    nl: { question: 'Je plan als het mooi weer is?', options: ['Naar buiten gaan ☀️', 'Wachten op de bui 🌧️'] }
                },
                captions: {
                    fr: "En Belgique, on sait jamais 🤷\n\nSoleil ? Pluie ? Les deux en 10 minutes ? Au moins avec Scarlet, ta connexion reste stable. Même quand la météo fait n'importe quoi.",
                    nl: "In België weet je maar nooit 🤷\n\nZon? Regen? Allebei binnen 10 minuten? Met Scarlet blijft je verbinding tenminste stabiel. Ook als het weer doet wat het wil."
                }
            },
            {
                id: 6, date: '29/03', format: 'pie_chart', pilier: 'Bon Marché',
                theme: "Changement d'heure",
                formatLabel: '📊 Pie Chart',
                data: {
                    fr: { chartTitle: 'Mon dimanche 29 mars', legends: ['Dormir', "Réaliser qu'on perd 1h", "Scroller pour s'en remettre"], percentages: [10, 20, 70] },
                    nl: { chartTitle: 'Mijn zondag 29 maart', legends: ['Slapen', 'Beseffen dat je 1u kwijt bent', 'Scrollen om te bekomen'], percentages: [10, 20, 70] }
                },
                captions: {
                    fr: "Ce matin, on a tous perdu 1h de sommeil ⏰😴\n\nLa bonne nouvelle ? Ton abonnement Scarlet, lui, ne t'a rien fait perdre. Pas de frais cachés, pas de mauvaise surprise. Juste du repos bien mérité (enfin, presque).",
                    nl: "Vanochtend verloren we allemaal 1 uur slaap ⏰😴\n\nHet goede nieuws? Je Scarlet-abonnement heeft je niks doen verliezen. Geen verborgen kosten, geen slechte verrassingen. Gewoon welverdiende rust (nou ja, bijna)."
                }
            }
        ];
        
        let currentPost = 0;
        let currentLang = 'fr';
        
        const pilierColors = { 'Bon Marché': 'badge-green', 'Qualité': 'badge-blue', 'Transparence': 'badge-yellow' };
        const chartColors = ['#2BA600', '#E61F13', '#FFB800', '#0066CC'];
        
        function renderSelector() {
            const html = posts.map((p, i) => `
                <button class="post-btn ${i === currentPost ? 'active' : ''}" onclick="selectPost(${i})">
                    <div class="date">${p.date}</div>
                    <div class="format">${p.formatLabel}</div>
                </button>
            `).join('');
            document.getElementById('postSelector').innerHTML = html;
        }
        
        function renderInfo() {
            const p = posts[currentPost];
            const d = p.data[currentLang];
            document.getElementById('infoPanel').innerHTML = `
                <div style="margin-bottom:20px">
                    <span class="badge ${pilierColors[p.pilier]}">${p.pilier}</span>
                    <span class="badge badge-format">${p.formatLabel}</span>
                </div>
                <h2 style="font-size:22px;margin-bottom:8px">Post #${p.id} — ${p.date}/2026</h2>
                <p style="opacity:0.7;margin-bottom:20px">${p.theme}</p>
                <div class="lang-toggle">
                    <label>Langue</label>
                    <button class="lang-btn ${currentLang==='fr'?'active':''}" onclick="setLang('fr')">🇫🇷 Français</button>
                    <button class="lang-btn ${currentLang==='nl'?'active':''}" onclick="setLang('nl')">🇧🇪 Nederlands</button>
                </div>
                <div class="content-box">
                    <h3>📝 Contenu du visuel (${currentLang.toUpperCase()})</h3>
                    <pre>${JSON.stringify(d, null, 2)}</pre>
                </div>
                <div style="margin-top:20px;padding:16px;background:rgba(230,31,19,0.1);border-radius:10px;border-left:4px solid #E61F13">
                    <p style="font-size:13px;opacity:0.8">
                        💡 Pour le format <strong>Meme</strong>, remplacer les emojis par les images appropriées 
                        (rechercher sur Imgflip ou Kapwing le template qui correspond au concept).
                    </p>
                </div>
            `;
        }
        
        function renderVisual() {
            const p = posts[currentPost];
            const d = p.data[currentLang];
            const caption = p.captions[currentLang];
            let inner = '';
            
            if (p.format === 'pie_chart') {
                const total = d.percentages.reduce((a,b) => a+b, 0);
                let gradient = '';
                let cumul = 0;
                d.percentages.forEach((pct, i) => {
                    const start = (cumul / total) * 100;
                    cumul += pct;
                    const end = (cumul / total) * 100;
                    gradient += `${chartColors[i]} ${start}% ${end}%${i < d.percentages.length - 1 ? ',' : ''}`;
                });
                
                inner = `
                    <div class="visual-inner">
                        <div class="visual-title">${d.chartTitle}</div>
                        <div class="pie-container">
                            <div class="pie-chart" style="background: conic-gradient(${gradient})"></div>
                            <div>
                                ${d.legends.map((l, i) => `
                                    <div class="legend-item">
                                        <div class="legend-color" style="background:${chartColors[i]}"></div>
                                        <span class="legend-text">${l}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (p.format === 'meme') {
                inner = `
                    <div class="meme-inner">
                        <div class="meme-panel top">
                            <div>
                                <div class="meme-emoji">😌</div>
                                <div class="meme-text">${d.topText}</div>
                            </div>
                        </div>
                        <div class="meme-panel bottom">
                            <div>
                                <div class="meme-emoji">😵‍💫</div>
                                <div class="meme-text">${d.bottomText}</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (p.format === 'checklist') {
                inner = `
                    <div class="visual-inner">
                        <div class="visual-title">${d.checklistTitle}</div>
                        ${d.items.map(item => `
                            <div class="check-item">
                                <div class="check-box">✓</div>
                                <span class="check-text">${item}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (p.format === 'poll') {
                inner = `
                    <div class="visual-inner" style="justify-content:center">
                        <div class="poll-question">${d.question}</div>
                        <div class="poll-option opt1">${d.options[0]}</div>
                        <div class="poll-option opt2">${d.options[1]}</div>
                    </div>
                `;
            }
            
            document.getElementById('previewPanel').innerHTML = `
                <div class="visual-wrapper">
                    <div class="caption-box">
                        <h4>📱 Caption ${currentLang.toUpperCase()} (à copier)</h4>
                        <p>${caption}</p>
                    </div>
                    <div class="visual" id="visualToExport">
                        ${inner}
                        <div class="logo">scarlet</div>
                    </div>
                    <button class="export-btn" onclick="exportPNG()" id="exportBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Exporter en PNG
                    </button>
                </div>
                
                <div class="comments-section">
                    <h3>💬 Commentaires et Feedback</h3>
                    
                    <div class="feedback-guide">
                        <h4>📝 Comment laisser un feedback ?</h4>
                        <ul>
                            <li>✅ <strong>Validation</strong> : Cochez "Validé" si le post est OK</li>
                            <li>🎨 <strong>Modifications visuelles</strong> : Décrivez les changements souhaités</li>
                            <li>✍️ <strong>Corrections texte</strong> : Signalez les typos ou reformulations</li>
                            <li>💡 <strong>Suggestions</strong> : Proposez des idées alternatives</li>
                        </ul>
                    </div>
                    
                    <div class="comments-intro">
                        <span>✨</span>
                        <div><strong>Aucun compte requis !</strong> Remplissez simplement le formulaire ci-dessous.</div>
                    </div>
                    
                    <div id="tally-container"></div>
                </div>
            `;
            
            // Charger le formulaire Tally pour le post actuel
            loadTallyForm(p.id);
        }
        
        function loadTallyForm(postId) {
            const container = document.getElementById('tally-container');
            if (!container) return;
            
            // URL de votre formulaire Tally (À CONFIGURER)
            const tallyFormId = 'b5dPb7'; // ⚠️ À REMPLACER après création sur Tally.so
            
            // Si le formulaire n'est pas encore configuré, afficher un message
            if (tallyFormId === 'b5dPb7') {
                container.innerHTML = `
                    <div class="setup-notice">
                        <strong>⚙️ Configuration requise</strong><br>
                        Pour activer les commentaires, suivez le guide TALLY_SETUP.md pour créer votre formulaire Tally.so
                        et remplacer "VOTRE_FORM_ID" dans ce fichier.
                    </div>
                `;
                return;
            }
            
            // Créer l'iframe Tally avec le numéro de post pré-rempli
            container.innerHTML = `
                <iframe 
                    src="https://tally.so/embed/${tallyFormId}?transparentBackground=1&hideTitle=1&dynamicHeight=1&post=${postId}"
                    class="tally-iframe"
                    frameborder="0"
                    marginheight="0"
                    marginwidth="0"
                    title="Feedback Publication ${postId}"
                    loading="lazy">
                </iframe>
            `;
        }
        
        function selectPost(i) {
            currentPost = i;
            render();
        }
        
        function setLang(l) {
            currentLang = l;
            render();
        }
        
        function render() {
            renderSelector();
            renderInfo();
            renderVisual();
        }
        
        async function exportPNG() {
            const btn = document.getElementById('exportBtn');
            const visual = document.getElementById('visualToExport');
            
            btn.classList.add('loading');
            btn.innerHTML = '⏳ Export en cours...';
            
            try {
                const canvas = await html2canvas(visual, {
                    scale: 2,
                    backgroundColor: null,
                    logging: false
                });
                
                const link = document.createElement('a');
                const p = posts[currentPost];
                link.download = `Scarlet_Mars2026_Post${p.id}_${p.format}_${currentLang.toUpperCase()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                btn.innerHTML = '✅ Exporté !';
                setTimeout(() => {
                    btn.innerHTML = `
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Exporter en PNG
                    `;
                    btn.classList.remove('loading');
                }, 2000);
            } catch (error) {
                console.error('Export error:', error);
                btn.innerHTML = '❌ Erreur - Réessayer';
                btn.classList.remove('loading');
            }
        }
        
        render();
    </script>
</body>
</html>
